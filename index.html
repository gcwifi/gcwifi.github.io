<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuestConnect</title>
</head>
<body>
<script>
(function () {
    const rawCode = window.location.search.substring(1).trim();

    if (rawCode) {
        const code = decodeURIComponent(rawCode);
        window.location.replace(
            "c.html?c=" + encodeURIComponent(code)
        );
        return;
    }

    window.location.replace("restaurant.html");
})();
</script>

<noscript>
    <p>Please enable JavaScript to use GuestConnect.</p>
</noscript>
</body>
</html>
