<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuestConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#17212b}.header{background:#111827;color:#fff;padding:20px 18px;text-align:center}.logo{font-size:25px;font-weight:800;letter-spacing:-.5px}.logo span{color:#22c55e}.container{width:100%;max-width:560px;margin:0 auto;padding:20px 15px 35px}.card{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 5px 20px rgba(0,0,0,.07)}.type-pill{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}.type-pill.accommodation{background:#ecfeff;color:#0e7490}.name{margin:0;font-size:28px;font-weight:800;color:#111827}.location{margin-top:6px;color:#6b7280;font-size:15px}.wifi{margin-top:24px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:18px}.wifi-title{font-size:19px;font-weight:800;margin-bottom:15px;color:#166534}.label{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-top:12px}.value{margin-top:5px;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:12px;font-size:16px;word-break:break-word}.password-row{display:flex;gap:8px;margin-top:5px}.password{flex:1;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:12px;font-size:16px;word-break:break-word;min-width:0}.copy{border:0;border-radius:10px;padding:0 15px;background:#16a34a;color:#fff;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}.copy:active{transform:scale(.98)}.instructions{margin-top:20px;padding:15px;border-radius:14px;background:#f8fafc;color:#475569;line-height:1.55;font-size:14px}.room-section{margin-top:22px;background:#ecfeff;border:1px solid #a5f3fc;border-radius:16px;padding:18px}.room-title{font-size:18px;font-weight:800;color:#155e75;margin-bottom:12px}.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.room-btn{border:1px solid #a5f3fc;background:#fff;border-radius:12px;padding:13px;text-align:left;font-weight:700;color:#164e63;cursor:pointer}.room-btn:hover{background:#f0fdff}.room-btn.active{border-color:#0891b2;background:#cffafe}.problem{margin-top:18px;width:100%;border:1px solid #bfdbfe;background:#eff6ff;color:#2563eb;border-radius:11px;padding:12px;font-weight:700;cursor:pointer}.problem:disabled{opacity:.55;cursor:default}.status{text-align:center;font-size:13px;margin-top:9px;min-height:18px}.ad{margin-top:24px;text-align:center;font-size:12px;color:#94a3b8}.ad a{color:#64748b;text-decoration:none}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:18px}.error{background:#fff;border-radius:18px;padding:25px;text-align:center;color:#b91c1c}.loading{text-align:center;padding:35px;color:#64748b}@media(max-width:430px){.room-grid{grid-template-columns:1fr}.name{font-size:25px}.copy{padding:0 12px}}
</style>
</head>
<body>
<header class="header"><div class="logo">Guest<span>Connect</span></div></header>
<main class="container"><div class="card" id="content"><div class="loading">Loading Wi-Fi details…</div></div><div class="ad">Want to advertise here? <a href="mailto:guestconnectwifi@gmail.com">guestconnectwifi@gmail.com</a></div><div class="footer">Powered by GuestConnect</div></main>
<script>
const SUPABASE_URL="https://ksrsjhwklrwrfgzkqcbi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_bLtm1wBIxmZvwLteiMA2tg_BtLHhgGc";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let current=null, selectedRoom=null;
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function getCode(){return new URLSearchParams(location.search).get("code")?.trim().toUpperCase()||"";}
function getVisitorId(){const key="guestconnect_visitor_id";try{let id=localStorage.getItem(key);if(id)return id;id=crypto?.randomUUID?crypto.randomUUID():"gc-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);localStorage.setItem(key,id);return id}catch(e){return "gc-temp-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)}}
async function recordVisit(){if(!current)return;try{await supabaseClient.rpc("record_public_visit",{p_restaurant_id:current.id,p_visitor_id:getVisitorId()});}catch(e){console.warn("GuestConnect visit tracking failed",e)}}
function wifiBlock(title,name,password){return `<section class="wifi"><div class="wifi-title">${esc(title)}</div><div class="label">Wi-Fi name</div><div class="value">${esc(name||"Not provided")}</div><div class="label">Password</div><div class="password-row"><div class="password" id="passwordValue">${esc(password||"Not provided")}</div><button class="copy" onclick="copyPassword()">Copy</button></div></section>`}
function render(){const c=document.getElementById("content");const isAcc=current.location_type==="accommodation";let html=`<div class="type-pill ${isAcc?'accommodation':''}">${isAcc?'Accommodation':'Restaurant'}</div><h1 class="name">${esc(current.name)}</h1><div class="location">${esc(current.location)}</div>`;
if(isAcc && current.wifi_mode==="rooms"){
 html+=`<section class="room-section"><div class="room-title">Select your room</div><div class="room-grid">${(current.rooms||[]).map((r,i)=>`<button class="room-btn ${selectedRoom===i?'active':''}" onclick="selectRoom(${i})">${esc(r.name||('Room '+(i+1)))}</button>`).join('')}</div></section>`;
 if(selectedRoom!==null && current.rooms[selectedRoom]){const r=current.rooms[selectedRoom];html+=wifiBlock((r.name||'Room')+" Wi-Fi",r.wifi_name,r.wifi_password)}
 else html+=`<div class="instructions">Select your room above to view the Wi-Fi details.</div>`;
}else{html+=wifiBlock(isAcc?'Wi-Fi':'Restaurant Wi-Fi',current.wifi_name,current.wifi_password);}
html+=`<div class="instructions">Connect your phone to the Wi-Fi using the details above. If the password has recently changed or does not work, you can report the problem below.</div><button class="problem" id="problemBtn" onclick="reportProblem()">Report Wi-Fi problem</button><div class="status" id="reportStatus"></div>`;c.innerHTML=html;}
window.selectRoom=function(i){selectedRoom=i;render();};
window.copyPassword=async function(){let p;if(current.location_type==="accommodation"&&current.wifi_mode==="rooms"&&selectedRoom!==null)p=current.rooms[selectedRoom]?.wifi_password;else p=current.wifi_password;if(!p)return;try{await navigator.clipboard.writeText(p);const b=document.querySelector('.copy');if(b){const old=b.textContent;b.textContent="Copied!";setTimeout(()=>b.textContent=old,1400)}}catch(e){alert("Could not copy automatically. Please select and copy the password.")}};
window.reportProblem=async function(){const b=document.getElementById("problemBtn"),s=document.getElementById("reportStatus");b.disabled=true;s.textContent="Sending report…";const {data,error}=await supabaseClient.rpc("report_wifi_problem_by_code",{p_code:getCode()});if(error||data!==true){s.textContent="Could not send the report. Please tell reception or staff.";b.disabled=false;return}s.textContent="Thanks — the Wi-Fi problem has been reported.";b.textContent="✓ Report sent";};
async function load(){const code=getCode();if(!code){document.getElementById("content").innerHTML='<div class="error"><h2>No GuestConnect code</h2><p>Please scan a valid GuestConnect QR code.</p></div>';return}const {data,error}=await supabaseClient.rpc("get_public_restaurant_by_code",{p_code:code});if(error||!data||!data.length){document.getElementById("content").innerHTML='<div class="error"><h2>Location not found</h2><p>This GuestConnect QR code is not currently linked to a location.</p></div>';return}current=data[0];current.rooms=Array.isArray(current.rooms)?current.rooms:[];render();recordVisit();}
load();
</script>
</body>
</html>
